  }

  function colorFor(i) {
    var palette = ['#C8A24B', '#7B1E22', '#1F4E46', '#D98A3D', '#3E5C76', '#A6432E', '#5E8C6A', '#8C6A3E'];
    return palette[i % palette.length];
  }

  // ------------------------------------------------------------------
  // Canvas / dibujo de la ruleta
  // ------------------------------------------------------------------
  function resizeCanvas() {
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 1;
    var size = canvas.clientWidth || 400;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    _size = size;
    draw();
  }

  function draw() {
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var size = _size || (canvas.clientWidth || 400);
    var cx = size / 2, cy = size / 2, r = size / 2 - 6;
    ctx.clearRect(0, 0, size, size);
    var list = S.participants, n = list.length;

    ctx.save();
    ctx.translate(cx, cy);

    if (n === 0) {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = '#EDE5D4'; ctx.fill();
      ctx.lineWidth = size * 0.03; ctx.strokeStyle = '#C8A24B'; ctx.stroke();
      ctx.restore(); return;
    }

    var seg = (Math.PI * 2) / n;
    var showLabels = n <= 60;
    var fs = Math.max(9, Math.min(26, 460 / n));

    for (var i = 0; i < n; i++) {
      var start = angle + i * seg, end = start + seg;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, start, end); ctx.closePath();
      ctx.fillStyle = list[i].color; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke();

      if (showLabels) {
        var mid = start + seg / 2;
        var m = ((mid % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        var label = list[i].name || '';
        if (label.length > 13) label = label.slice(0, 12) + '…';
        ctx.save();
        ctx.rotate(mid);
        ctx.fillStyle = '#ffffff';
        ctx.font = '600 ' + fs + 'px "Helvetica Neue", Arial, sans-serif';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 2;
        var rt = r * 0.94;
        if (m > Math.PI / 2 && m < Math.PI * 1.5) {
          ctx.rotate(Math.PI); ctx.textAlign = 'left'; ctx.fillText(label, -rt, 0);
        } else {
          ctx.textAlign = 'right'; ctx.fillText(label, rt, 0);
        }
        ctx.restore();
      }
    }

    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.lineWidth = size * 0.028; ctx.strokeStyle = '#C8A24B'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, size * 0.085, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();

    ctx.restore();
  }

  function getIndexAt(rot) {
    var n = S.participants.length; if (!n) return 0;
    var seg = (Math.PI * 2) / n;
    var a = (pointerAngle - rot) % (Math.PI * 2);
    a = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(a / seg) % n;
  }

  // ------------------------------------------------------------------
  // Audio
  // ------------------------------------------------------------------
  function ensureAudio() {
    if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function playTick() {
    if (!actx) return;
    var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.07);
  }
  function playFanfare() {
    if (!actx) return;
    var t0 = actx.currentTime, notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach(function (f, i) {
      var t = t0 + i * 0.13, o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.55);
    });
  }

  // ------------------------------------------------------------------
  // Render de las partes dinámicas
  // ------------------------------------------------------------------
  function renderList() {
    var box = $('list');
    box.innerHTML = '';
    S.participants.forEach(function (p) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:8px;';
      var dot = document.createElement('span');
      dot.style.cssText = 'width:14px; height:14px; border-radius:50%; flex:0 0 auto; background:' + p.color + '; box-shadow:0 0 0 1px rgba(0,0,0,.06);';
      var name = document.createElement('span');
      name.style.cssText = 'flex:1 1 auto; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
      name.textContent = p.name;
      var del = document.createElement('button');
      del.style.cssText = 'flex:0 0 auto; width:24px; height:24px; border:none; border-radius:6px; background:#F0E9DA; color:#9a8f78; font-size:15px; line-height:1; cursor:pointer;';
      del.textContent = '×';
      del.addEventListener('click', function () { removeParticipant(p.id); });
      row.appendChild(dot); row.appendChild(name); row.appendChild(del);
      box.appendChild(row);
    });
    $('count').textContent = S.participants.length;
    $('emptyHint').classList.toggle('hidden', S.participants.length !== 0);
    updateSpinBtn();
  }

  function renderWinners() {
    var wrap = $('winnersWrap');
    wrap.classList.toggle('hidden', S.winners.length === 0);
    $('winnersCount').textContent = S.winners.length;
    var box = $('winnersList'); box.innerHTML = '';
    S.winners.forEach(function (w) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex; align-items:center; gap:8px; font-size:13.5px; color:#7c7259; padding:2px 0;';
      var chk = document.createElement('span'); chk.style.color = '#C8A24B'; chk.textContent = '✓';
      var nm = document.createElement('span'); nm.textContent = w.name;
      row.appendChild(chk); row.appendChild(nm); box.appendChild(row);
    });
  }

  function renderAdmin() {
    var box = $('adminList'); box.innerHTML = '';
    S.participants.forEach(function (p) {
      var label = document.createElement('label');
      label.style.cssText = 'display:flex; align-items:center; gap:12px; padding:11px 14px; border-bottom:1px solid #F0E9DA; cursor:pointer;';
      var cb = document.createElement('input'); cb.type = 'checkbox';
      cb.checked = S.rigged.indexOf(p.id) !== -1;
      cb.style.cssText = 'width:20px; height:20px; accent-color:#C8A24B; flex:0 0 auto;';
      cb.addEventListener('change', function () { toggleRig(p.id); });
      var dot = document.createElement('span');
      dot.style.cssText = 'width:12px; height:12px; border-radius:50%; flex:0 0 auto; background:' + p.color + ';';
      var nm = document.createElement('span');
      nm.style.cssText = 'flex:1 1 auto; font-size:15px; color:#2A2622;';
      nm.textContent = p.name;
      label.appendChild(cb); label.appendChild(dot); label.appendChild(nm);
      box.appendChild(label);
    });
  }

  function updateSpinBtn() {
    var dis = S.spinning || S.participants.length === 0;
    $('btnSpin').disabled = dis;
    $('btnSpin').style.opacity = dis ? '.55' : '1';
    $('btnShuffle').disabled = S.spinning || S.participants.length < 2;
    $('spinText').classList.toggle('hidden', S.spinning);
    $('spinImg').classList.toggle('hidden', !S.spinning);
  }

  function persistAndRedraw() { persist(); draw(); renderList(); renderWinners(); }

  // ------------------------------------------------------------------
  // Acciones
  // ------------------------------------------------------------------
  function onAddNames() {
    var el = $('ta');
    var names = (el.value || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!names.length) return;
    var base = S.participants.length;
    var add = names.map(function (name, k) {
      return { id: 'p' + Date.now().toString(36) + k + Math.random().toString(36).slice(2, 6), name: name, color: colorFor(base + k) };
    });
    S.participants = S.participants.concat(add);
    el.value = '';
    persistAndRedraw();
  }

  function removeParticipant(id) {
    S.participants = S.participants.filter(function (p) { return p.id !== id; });
    S.rigged = S.rigged.filter(function (x) { return x !== id; });
    persistAndRedraw();
  }

  function onSpin() {
    if (S.spinning || !S.participants.length) return;
    ensureAudio();
    var n = S.participants.length;
    var forced = S.participants.map(function (p, i) { return S.rigged.indexOf(p.id) !== -1 ? i : -1; }).filter(function (i) { return i >= 0; });
    var w = forced.length ? forced[Math.floor(Math.random() * forced.length)] : Math.floor(Math.random() * n);
    var seg = (Math.PI * 2) / n;
    var center = w * seg + seg / 2;
    var jitter = (Math.random() - 0.5) * seg * 0.55;
    var desired = pointerAngle - center - jitter;
    var TWO = Math.PI * 2;
    var delta = (((desired - angle) % TWO) + TWO) % TWO;
    var turns = 6 + Math.floor(Math.random() * 4);
    var target = angle + delta + turns * TWO;
    var start = angle;
    var dur = 4800 + Math.random() * 1600;
    var startTime = performance.now();
    var ease = function (t) { return 1 - Math.pow(1 - t, 3); };
    lastTickIdx = getIndexAt(angle);
    S.spinning = true; S.winner = null; updateSpinBtn();

    var step = function (now) {
      var t = (now - startTime) / dur; if (t > 1) t = 1;
      angle = start + (target - start) * ease(t);
      draw();
      var idx = getIndexAt(angle);
      if (idx !== lastTickIdx) { lastTickIdx = idx; playTick(); }
      if (t < 1) { raf = requestAnimationFrame(step); }
      else { angle = target; draw(); finishSpin(w); }
    };
    raf = requestAnimationFrame(step);
  }

  function finishSpin(w) {
    S.spinning = false;
    S.winner = S.participants[w];
    updateSpinBtn();
    showWinner(S.winner);
    playFanfare();
  }

  function onWinnerRemove() {
    var wn = S.winner; if (!wn) return;
    S.participants = S.participants.filter(function (p) { return p.id !== wn.id; });
    S.rigged = S.rigged.filter(function (x) { return x !== wn.id; });
    S.winners = S.winners.concat([{ name: wn.name }]);
    S.winner = null;
    hideWinner();
    persistAndRedraw();
  }
  function onWinnerKeep() { S.winner = null; hideWinner(); }

  function onShuffle() {
    if (S.spinning || S.participants.length < 2) return;
    var a = S.participants.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    S.participants = a;
    persistAndRedraw();
  }

  function onEndRaffle() {
    if (!window.confirm('¿Terminar el sorteo? Se borrarán todos los nombres y ganadores.')) return;
    angle = 0;
    S.participants = []; S.winners = []; S.winner = null; S.spinning = false; S.rigged = [];
    hideWinner();
    persistAndRedraw();
  }

  function toggleRig(id) {
    if (S.rigged.indexOf(id) !== -1) S.rigged = S.rigged.filter(function (x) { return x !== id; });
    else S.rigged = S.rigged.concat([id]);
    persist();
  }

  // ------------------------------------------------------------------
  // Modales
  // ------------------------------------------------------------------
  function showWinner(w) { $('winnerName').textContent = w ? w.name : ''; $('winnerModal').classList.remove('hidden'); }
  function hideWinner() { $('winnerModal').classList.add('hidden'); }

  // --- Gate (código oculto) con FIX del "click fantasma" táctil ---
  var gateOpenedAt = 0;
  function openGate() {
    $('gateInput').value = '';
    $('gateErr').classList.add('hidden');
    $('gate').classList.remove('hidden');
    gateOpenedAt = Date.now();
    setTimeout(function () { try { $('gateInput').focus(); } catch (e) {} }, 50);
  }
  function closeGate() { $('gate').classList.add('hidden'); }
  function submitGate() {
    if ($('gateInput').value === '2002') { closeGate(); openAdmin(); }
    else { $('gateErr').classList.remove('hidden'); }
  }
  function openAdmin() { renderAdmin(); $('admin').classList.remove('hidden'); }
  function closeAdmin() { $('admin').classList.add('hidden'); }

  // ------------------------------------------------------------------
  // Cargar participantes desde una FOTO (OCR con IA vía proxy)
  // Manda la foto al Worker, que le pega a la IA y devuelve los usuarios
  // (la parte de ANTES del @). Caen en el textarea para que los revises.
  // ------------------------------------------------------------------
  function setOcr(msg, show) {
    if (msg != null) $('ocrStatus').textContent = msg;
    $('ocrStatus').style.display = (show === false) ? 'none' : 'block';
  }

  function setPhotoBtns(disabled) {
    ['btnCamera', 'btnPhoto'].forEach(function (id) {
      var b = $(id); if (b) { b.disabled = disabled; b.style.opacity = disabled ? '.6' : '1'; }
    });
  }

  // Reescala la foto y la devuelve como base64 JPEG (payload liviano).
  function fileToBase64Scaled(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var maxW = 1280;
        var scale = img.width > maxW ? maxW / img.width : 1;
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        try { URL.revokeObjectURL(img.src); } catch (e) {}
        var dataUrl = c.toDataURL('image/jpeg', 0.85);
        resolve(dataUrl.split(',')[1]);
      };
      img.onerror = function () { reject(new Error('No pude abrir la imagen')); };
      img.src = URL.createObjectURL(file);
    });
  }

  function runOCR(file) {
    if (!OCR_ENDPOINT) {
      setOcr('Falta configurar el servidor de lectura (OCR_ENDPOINT arriba del código). Ver worker.js.');
      return;
    }
    setPhotoBtns(true);
    setOcr('Preparando imagen…');
    fileToBase64Scaled(file).then(function (b64) {
      setOcr('Leyendo con IA…');
      return fetch(OCR_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: b64, mimeType: 'image/jpeg' })
      });
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
        return data;
      });
    }).then(function (data) {
      var users = (data && data.users) || [];
      var seen = {}, out = [];
      users.forEach(function (u) {
        u = String(u).trim().toLowerCase();
        if (u.indexOf('@') !== -1) u = u.split('@')[0];
        u = u.replace(/^[._\-]+|[._\-]+$/g, '');
        if (u && !seen[u]) { seen[u] = 1; out.push(u); }
      });
      if (!out.length) {
        setOcr('No encontré mails en la foto. Probá con más luz y de frente.');
      } else {
        var ta = $('ta');
        var prev = (ta.value || '').trim();
        ta.value = (prev ? prev + '\n' : '') + out.join('\n');
        setOcr('Detecté ' + out.length + ' mail(s). Revisá la lista y tocá "Agregar a la ruleta".');
      }
    }).catch(function (err) {
      setOcr('No pude leer la imagen: ' + (err && err.message ? err.message : 'error') + '. ¿Hay internet? ¿El Worker está activo?');
    }).then(function () {
      setPhotoBtns(false);
    });
  }

  // ------------------------------------------------------------------
  // Cableado de eventos (una sola vez cada uno)
  // ------------------------------------------------------------------
  $('btnAdd').addEventListener('click', onAddNames);
  $('btnShuffle').addEventListener('click', onShuffle);
  $('btnEnd').addEventListener('click', onEndRaffle);
  $('btnSpin').addEventListener('click', onSpin);
  $('winnerRemove').addEventListener('click', onWinnerRemove);
  $('winnerKeep').addEventListener('click', onWinnerKeep);
  $('gateCancel').addEventListener('click', closeGate);
  $('gateSubmit').addEventListener('click', submitGate);
  $('adminClose').addEventListener('click', closeAdmin);
  $('gateInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitGate(); });

  $('btnCamera').addEventListener('click', function () { $('cameraInput').click(); });
  $('cameraInput').addEventListener('change', function () {
    var file = $('cameraInput').files && $('cameraInput').files[0];
    $('cameraInput').value = '';
    if (file) runOCR(file);
  });
  $('btnPhoto').addEventListener('click', function () { $('photoInput').click(); });
  $('photoInput').addEventListener('change', function () {
    var file = $('photoInput').files && $('photoInput').files[0];
    $('photoInput').value = '';           // permite volver a elegir la misma foto
    if (file) runOCR(file);
  });

  // FIX 1: el conteo de toques usa 'click' (no 'pointerdown').
  var taps = 0, tapT = 0;
  $('logo').addEventListener('click', function () {
    var now = Date.now();
    if (!tapT || now - tapT > 4000) taps = 0;
    tapT = now; taps += 1;
    if (taps >= 5) { taps = 0; openGate(); }
  });

  // FIX 2: ignorar el "cerrar al tocar el fondo" durante los primeros 400 ms.
  $('gate').addEventListener('click', function (e) {
    if (e.target !== $('gate')) return;
    if (Date.now() - gateOpenedAt < 400) return;
    closeGate();
  });
  $('gateBox').addEventListener('click', function (e) { e.stopPropagation(); });

  // ------------------------------------------------------------------
  // Arranque
  // ------------------------------------------------------------------
  window.addEventListener('resize', resizeCanvas);
  load();
  renderList();
  renderWinners();
  requestAnimationFrame(resizeCanvas);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
